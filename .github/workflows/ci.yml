name: CI Checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flake8 pytest httpx
          pip install -r product-service/requirements.txt
          pip install -r order-service/requirements.txt
          pip install -r payment-service/requirements.txt

      - name: Lint Python code
        run: |
          flake8 product-service/app/ --max-line-length=120 --ignore=E501
          flake8 order-service/app/ --max-line-length=120 --ignore=E501
          flake8 payment-service/app/ --max-line-length=120 --ignore=E501

      - name: Validate Kubernetes manifests
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          ./kubectl apply --dry-run=client -f k8s/ -R

      - name: Validate Docker builds
        run: |
          docker build -t product-service-test ./product-service
          docker build -t order-service-test ./order-service
          docker build -t payment-service-test ./payment-service

      - name: Validate Azure credentials
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

            ## CI test comment