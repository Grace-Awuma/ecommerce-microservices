name: Build and Push to ACR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push product-service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }} ./product-service
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/product-service:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/product-service:latest

      - name: Build and push order-service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }} ./order-service
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/order-service:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/order-service:latest

      - name: Build and push payment-service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }} ./payment-service
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:latest